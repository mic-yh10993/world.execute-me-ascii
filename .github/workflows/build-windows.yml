name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller just-playback
      - name: Build Windows package
        run: python tools/build_windows.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: world-execute-mv-windows
          path: dist/world-execute-mv-windows.zip
